openapi: 3.0.3

info:
  title: KidQuest API
  version: 1.0.0
  description: |
    KidQuest is a comprehensive child development platform that provides educational tools, 
    emotional support, health tracking, and parent-teacher collaboration features.
    
    **Authentication**: Most endpoints require user authentication. Use the login endpoint 
    to obtain session credentials.
    
    **User Roles**: 
    - child: Young users accessing educational content
    - parent: Guardians monitoring child progress
    - teacher: Educators managing classroom activities
    - admin: System administrators
  contact:
    email: support@kidquest.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:5000
    description: Development server
  - url: https://api.kidquest.com
    description: Production server

components:
  securitySchemes:
    SessionAuth:
      type: apiKey
      in: cookie
      name: session
    
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          description: Unique user identifier
        username:
          type: string
          description: User's chosen username
        email:
          type: string
          format: email
          description: User's email address
        role:
          type: string
          enum: [child, parent, teacher, admin]
          description: User's role in the system
      required:
        - id
        - username
        - role

    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          description: Desired username
        password:
          type: string
          minLength: 6
          description: User password
        email:
          type: string
          format: email
          description: User email address
        role:
          type: string
          enum: [child, parent, teacher]
          description: User role
        relationship_type:
          type: string
          enum: [Mother, Father, Guardian]
          description: Required for parent registration
        child_username:
          type: string
          description: Child's username (for parent registration)
        className:
          type: string
          description: Class name (for teacher registration)
        primarySubject:
          type: string
          enum: [Mathematics, Science, English, Social Studies, Art, Physical Education, Computer Science, General Studies]
          description: Primary subject (for teacher registration)
        selectedStudents:
          type: array
          items:
            type: integer
          description: Array of student IDs (for teacher registration)
      required:
        - username
        - password
        - role

    LoginRequest:
      type: object
      properties:
        username:
          type: string
          description: Username
        password:
          type: string
          description: Password
      required:
        - username
        - password

    ChatMessage:
      type: object
      properties:
        message:
          type: string
          description: User's message to the chatbot
        user_id:
          type: integer
          description: ID of the user sending the message
        session_id:
          type: integer
          description: Optional chat session ID
      required:
        - message
        - user_id

    ChatResponse:
      type: object
      properties:
        success:
          type: boolean
        response:
          type: string
          description: Chatbot's response
        timestamp:
          type: string
          format: date-time
        session_id:
          type: integer
          description: Chat session ID
        mood:
          type: string
          description: Detected mood from the conversation

    Transaction:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: number
          format: float
        type:
          type: string
          enum: [income, expense]
        description:
          type: string
        date:
          type: string
          format: date-time
        user_id:
          type: integer

    SavingGoal:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        target_amount:
          type: number
          format: float
        current_amount:
          type: number
          format: float
        user_id:
          type: integer

    Task:
      type: object
      properties:
        id:
          type: integer
        subject:
          type: string
        task:
          type: string
        due_date:
          type: string
          format: date
        status:
          type: string
          enum: [pending, in-progress, completed]
        created_at:
          type: string
          format: date-time
        time_spent:
          type: integer
          description: Time spent in minutes

    HealthTask:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        completed:
          type: boolean

    PomodoroSession:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        homework_id:
          type: integer
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        work_duration:
          type: integer
          description: Work duration in seconds
        break_duration:
          type: integer
          description: Break duration in seconds
        completed:
          type: boolean

    Drawing:
      type: object
      properties:
        id:
          type: integer
        description:
          type: string
        timestamp:
          type: string
          format: date-time
        file_path:
          type: string
        time_taken:
          type: integer
        ref_image_title:
          type: string

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type: string

paths:
  # Authentication Endpoints
  /api/auth/register:
    post:
      summary: Register a new user
      description: Register a new user (child, parent, or teacher) in the system
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Missing required fields or invalid data
        '409':
          description: Username or email already exists

  /api/auth/login:
    post:
      summary: User login
      description: Authenticate user and create session
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials

  # Chat/Emotional Support Endpoints
  /api/chat:
    post:
      summary: Send message to chatbot
      description: Send a message to the emotional support chatbot
      tags:
        - Chat & Emotional Support
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessage'
      responses:
        '200':
          description: Chatbot response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '400':
          description: Message is required

  /api/chat/history/{user_id}:
    get:
      summary: Get chat history
      description: Retrieve chat history for a specific user
      tags:
        - Chat & Emotional Support
      security:
        - SessionAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Chat history retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  messages:
                    type: array
                    items:
                      type: object

  /api/chat/sessions/{user_id}:
    get:
      summary: Get chat sessions
      description: Get all chat sessions for a user
      tags:
        - Chat & Emotional Support
      security:
        - SessionAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Chat sessions retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  sessions:
                    type: array
                    items:
                      type: object

  # Finance Tracker Endpoints
  /api/finance/transactions/{user_id}:
    get:
      summary: Get user transactions
      description: Retrieve all financial transactions for a user
      tags:
        - Finance Tracker
      security:
        - SessionAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Transactions retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'

  /api/finance/transaction:
    post:
      summary: Add transaction
      description: Add a new financial transaction
      tags:
        - Finance Tracker
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                amount:
                  type: number
                  format: float
                type:
                  type: string
                  enum: [income, expense]
                description:
                  type: string
              required:
                - user_id
                - amount
                - type
                - description
      responses:
        '201':
          description: Transaction added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  transaction:
                    $ref: '#/components/schemas/Transaction'

  /api/finance/goals/{user_id}:
    get:
      summary: Get savings goals
      description: Retrieve all savings goals for a user
      tags:
        - Finance Tracker
      security:
        - SessionAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Savings goals retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  goals:
                    type: array
                    items:
                      $ref: '#/components/schemas/SavingGoal'

  /api/finance/goal:
    post:
      summary: Add savings goal
      description: Create a new savings goal
      tags:
        - Finance Tracker
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                label:
                  type: string
                target_amount:
                  type: number
                  format: float
              required:
                - user_id
                - label
                - target_amount
      responses:
        '201':
          description: Savings goal created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  goal:
                    $ref: '#/components/schemas/SavingGoal'

  # Task Management Endpoints
  /api/tasks/{user_id}:
    get:
      summary: Get user tasks
      description: Retrieve all tasks/homework for a user
      tags:
        - Task Management
      security:
        - SessionAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tasks retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'

  /api/tasks:
    post:
      summary: Create task
      description: Create a new task/homework assignment
      tags:
        - Task Management
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                subject:
                  type: string
                task:
                  type: string
                due_date:
                  type: string
                  format: date
              required:
                - user_id
                - task
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  task:
                    $ref: '#/components/schemas/Task'

  /api/tasks/{task_id}/status:
    put:
      summary: Update task status
      description: Update the status of a specific task
      tags:
        - Task Management
      security:
        - SessionAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, in-progress, completed]
              required:
                - status
      responses:
        '200':
          description: Task status updated
        '404':
          description: Task not found

  # Pomodoro Timer Endpoints
  /api/pomodoro/start:
    post:
      summary: Start Pomodoro session
      description: Start a new Pomodoro study session for a task
      tags:
        - Pomodoro Timer
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                homework_id:
                  type: integer
              required:
                - user_id
                - homework_id
      responses:
        '201':
          description: Pomodoro session started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  session_id:
                    type: integer

  /api/pomodoro/complete/{session_id}:
    put:
      summary: Complete Pomodoro session
      description: Mark a Pomodoro session as completed
      tags:
        - Pomodoro Timer
      security:
        - SessionAuth: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                work_duration:
                  type: integer
                  description: Work duration in seconds
                break_duration:
                  type: integer
                  description: Break duration in seconds
      responses:
        '200':
          description: Session completed
        '404':
          description: Session not found

  # Health Tracking Endpoints
  /api/health/tasks/{user_id}:
    get:
      summary: Get health tasks
      description: Get daily health tasks for a user
      tags:
        - Health Tracking
      security:
        - SessionAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Health tasks retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/HealthTask'

  /api/health/tasks/{task_id}/toggle:
    post:
      summary: Toggle task completion
      description: Toggle the completion status of a health task
      tags:
        - Health Tracking
      security:
        - SessionAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task status toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  completed:
                    type: boolean

  /api/health/water/{user_id}:
    get:
      summary: Get water intake
      description: Get today's water intake count for a user
      tags:
        - Health Tracking
      security:
        - SessionAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Water intake retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer

    post:
      summary: Increment water intake
      description: Add one glass to today's water intake
      tags:
        - Health Tracking
      security:
        - SessionAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Water intake incremented
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer

  /api/health/streak/{user_id}:
    get:
      summary: Get health streak
      description: Get the current health streak for a user
      tags:
        - Health Tracking
      security:
        - SessionAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Health streak retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  streak:
                    type: integer

  # Drawing/Creative Endpoints
  /api/drawings/save:
    post:
      summary: Save drawing
      description: Save a user's drawing to the system
      tags:
        - Creative Activities
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                image_data:
                  type: string
                  description: Base64 encoded image data
                description:
                  type: string
                time_taken:
                  type: integer
                ref_image_path:
                  type: string
                ref_image_title:
                  type: string
              required:
                - user_id
                - image_data
      responses:
        '200':
          description: Drawing saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  drawing_id:
                    type: integer
                  message:
                    type: string

  /api/drawings/{user_id}:
    get:
      summary: Get user drawings
      description: Retrieve all drawings for a specific user
      tags:
        - Creative Activities
      security:
        - SessionAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Drawings retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  drawings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Drawing'

  /api/drawings/reference-images:
    get:
      summary: Get reference images
      description: Get available reference images for drawing inspiration
      tags:
        - Creative Activities
      responses:
        '200':
          description: Reference images retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  images:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        filename:
                          type: string
                        title:
                          type: string
                        url:
                          type: string

  # Psychometric Testing Endpoints
  /api/psychometry/start:
    post:
      summary: Start psychometric test
      description: Initialize a new psychometric assessment session
      tags:
        - Psychometric Testing
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
              required:
                - user_id
      responses:
        '200':
          description: Test started, first question returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  question:
                    type: string
                  options:
                    type: array
                    items:
                      type: string
                  question_number:
                    type: integer
                  total_questions:
                    type: integer
                  progress:
                    type: number

  /api/psychometry/submit:
    post:
      summary: Submit psychometric answer
      description: Submit an answer for the current psychometric question
      tags:
        - Psychometric Testing
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                answer:
                  type: string
              required:
                - user_id
                - answer
      responses:
        '200':
          description: Answer submitted, next question or results returned
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      question:
                        type: string
                      options:
                        type: array
                        items:
                          type: string
                      question_number:
                        type: integer
                      total_questions:
                        type: integer
                      progress:
                        type: number
                  - type: object
                    properties:
                      results:
                        type: object
                      total_questions:
                        type: integer
                      total_correct:
                        type: integer
                      accuracy:
                        type: number
                      duration_seconds:
                        type: number

  # Child Dashboard Endpoints
  /api/child/stats/{user_id}:
    get:
      summary: Get child statistics
      description: Get dashboard statistics for a child user
      tags:
        - Child Dashboard
      security:
        - SessionAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Child statistics retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  stats:
                    type: object
                    properties:
                      totalStars:
                        type: integer
                      questsCompleted:
                        type: integer
                      skillsLearned:
                        type: integer
                      todayGoals:
                        type: integer
                      streakDays:
                        type: integer
                      userLevel:
                        type: integer

  /api/child/quests/{user_id}:
    get:
      summary: Get child quests
      description: Get today's quests/activities for a child
      tags:
        - Child Dashboard
      security:
        - SessionAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Child quests retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  quests:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        description:
                          type: string
                        icon:
                          type: string
                        stars:
                          type: integer
                        completed:
                          type: boolean

  # Utility Endpoints
  /api/health:
    get:
      summary: API health check
      description: Check if the API is running and healthy
      tags:
        - Utility
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  status:
                    type: string

  /api/quote/{user_id}:
    get:
      summary: Get motivational quote
      description: Get a daily motivational quote for a user
      tags:
        - Utility
      security:
        - SessionAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Motivational quote retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  quote:
                    type: string

  /api/user/profile/{user_id}:
    get:
      summary: Get user profile
      description: Get profile information for a specific user
      tags:
        - User Management
      security:
        - SessionAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'
        '404':
          description: User not found

tags:
  - name: Authentication
    description: User registration and login endpoints
  - name: Chat & Emotional Support
    description: AI-powered emotional support chatbot
  - name: Finance Tracker
    description: Financial literacy and money management
  - name: Task Management
    description: Homework and task tracking
  - name: Pomodoro Timer
    description: Focus and productivity timer
  - name: Health Tracking
    description: Physical wellness and habit tracking
  - name: Creative Activities
    description: Drawing and artistic expression
  - name: Psychometric Testing
    description: Learning style and personality assessment
  - name: Child Dashboard
    description: Child-specific dashboard and statistics
  - name: User Management
    description: User profile and account management
  - name: Utility
    description: System utilities and helper endpoints