[build]
  # Directory to change to before starting a build
  base = "frontend/"
  
  # Directory that contains the deploy-ready HTML files and assets generated by the build
  publish = "dist/"
  
  # A command to run to build the site's files for production
  command = "rm -rf node_modules/.cache && npm install --include=dev && VITE_API_BASE_URL=https://kidquest-backend.onrender.com npx vite build"

[build.environment]
  # Node.js version
  NODE_VERSION = "18"
  # Backend API URL for production - CRITICAL for frontend to connect to backend
  VITE_API_BASE_URL = "https://kidquest-backend.onrender.com"
  # Ensure production mode
  NODE_ENV = "production"

# Redirect rules for Vue.js SPA (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
